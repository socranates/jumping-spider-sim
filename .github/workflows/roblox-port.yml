# The Roblox port's CLI checks on every push and pull request: strict types, every module compiles, all the suites.
# Nothing here runs Roblox; the suites run the shared code under the plain luau CLI with tests/shim.luau (see roblox_port/README.md).
name: roblox-port
on:
  push:
    paths: ["roblox_port/**", ".github/workflows/roblox-port.yml"]
  pull_request:
    paths: ["roblox_port/**", ".github/workflows/roblox-port.yml"]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: roblox_port
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain (Luau 0.743, luau-lsp 1.70.1, Rojo 7.7.1)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/luau" "$HOME/lsp" "$HOME/bin" "$RUNNER_TEMP/windowsill-toolchain"
          cd "$RUNNER_TEMP/windowsill-toolchain"
          curl -sSfL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.743/luau-ubuntu.zip
          curl -sSfL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          curl -sSfL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          curl -sSfL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/7a10f6d2dc6067934c66f9e3ad6cb4095594ac62/scripts/globalTypes.d.luau
          # Verify every download before extracting or executing any tool.
          sha256sum --check --strict <<'CHECKSUMS'
          99d45afb4afaee00ba631c526c8e8c76c67b60f6f119953ce6409be6d6953663  luau.zip
          1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  lsp.zip
          00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip
          71698e2454aacef1a144a498ffc1d7ea80654b9593025344672bc9106997bf6a  globalTypes.d.luau
          CHECKSUMS
          unzip -oq luau.zip -d "$HOME/luau"
          unzip -oq lsp.zip -d "$HOME/lsp"
          unzip -oq rojo.zip -d "$HOME/bin"
          install -m 0644 globalTypes.d.luau "$HOME/lsp/globalTypes.d.luau"
          chmod +x "$HOME/luau/luau" "$HOME/luau/luau-compile" "$HOME/lsp/luau-lsp" "$HOME/bin/rojo"
      - name: Every module compiles
        run: bash tools/check.sh compile
      - name: Strict types
        run: |
          out=$(bash tools/check.sh types 2>&1 | grep -v '^\[INFO\]\|didChangeWatchedFiles' || true)
          echo "$out"
          test -z "$out"
      - name: All suites
        run: python3 tests/run.py $HOME/luau/luau
      - name: Runner failure and cleanup regressions
        run: python3 -m unittest discover -s tests -p test_runner.py
